[project]
name = "myweb"
version = "0.1.0"
description = "Build, author and deploy my web sites from a datalad dataset of org sources"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
]

[project.scripts]
myweb = "myweb.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
myweb = ["*.el"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emacs: needs Emacs with ox-hugo (deselect with -m 'not emacs')",
    "hugo: needs hugo (deselect with -m 'not hugo')",
]
